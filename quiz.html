<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>General Knowledge Quiz | Decodelabs Project 4</title>
<meta name="description" content="A 3-question general knowledge quiz with a live score counter. Built with HTML, CSS and JavaScript.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --mint: #c9f5dc; --sky: #9fc4f5;
    --sage: #4d7a52; --sage-deep: #2f5237;
    --leaf: #a9c98f; --cream: #f4f1e4; --orange: #e8803a;
    --card: rgba(255,255,255,.74);
    --ink: #1f3324; --ink-soft: #46604b;
    --line: rgba(47,82,55,.25); --field: #ffffff;
    --good: #2f8a4c; --good-bg: #d8f3e0;
    --bad: #b8433f; --bad-bg: #fbe0de;
    --font-display: "Syne", "Trebuchet MS", system-ui, sans-serif;
    --font-mono: "DM Mono", ui-monospace, "Courier New", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --mint: #17322a; --sky: #1d3156;
      --sage: #8fc197; --sage-deep: #b9e0bf;
      --leaf: #35533a; --cream: #26332b;
      --card: rgba(18,30,24,.8);
      --ink: #e6f3e8; --ink-soft: #a9c4ae;
      --line: rgba(185,224,191,.28); --field: #101c15;
      --good: #7fd49a; --good-bg: #1c3d28;
      --bad: #f0928d; --bad-bg: #432322;
    }
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0; min-height: 100%;
    font-family: var(--font-mono); color: var(--ink);
    background: linear-gradient(115deg, var(--mint), var(--sky)) fixed;
    display: grid; place-items: center;
    padding: 24px 16px; position: relative; overflow-x: hidden;
  }
  body::before, body::after { content: ""; position: fixed; z-index: 0; pointer-events: none; }
  body::before {
    width: 46vmax; height: 46vmax; top: -18vmax; left: -14vmax;
    background: var(--leaf); opacity: .75;
    border-radius: 58% 42% 63% 37% / 44% 55% 45% 56%;
  }
  body::after {
    width: 40vmax; height: 40vmax; right: -14vmax; bottom: -16vmax;
    background: var(--cream); opacity: .85;
    border-radius: 45% 55% 40% 60% / 55% 40% 60% 45%;
  }
  main {
    position: relative; z-index: 1; width: min(580px, 100%);
    background: var(--card);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 28px;
    padding: clamp(22px, 5vw, 36px);
  }
  h1 {
    font-family: var(--font-display); font-weight: 800;
    font-size: clamp(1.6rem, 6vw, 2.2rem); line-height: 1.05;
    letter-spacing: .02em; margin: 0 0 6px; color: var(--sage-deep);
  }
  .sub { margin: 0 0 22px; color: var(--ink-soft); font-size: .9rem; line-height: 1.5; }

  .status { display: flex; justify-content: space-between; align-items: center; font-size: .9rem; margin-bottom: 10px; }
  .score { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; color: var(--sage-deep); }
  .progress { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin-bottom: 22px; }
  .progress span { display: block; height: 100%; width: 0; background: var(--sage); border-radius: 99px; transition: width .3s; }

  .question { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.2rem, 4.6vw, 1.55rem); line-height: 1.3; margin: 0 0 18px; }
  .options { display: grid; gap: 10px; }
  .option {
    text-align: left; width: 100%;
    font: 500 1rem var(--font-mono); color: var(--ink);
    background: var(--field); border: 2px solid var(--line);
    border-radius: 14px; padding: 14px 16px; cursor: pointer;
  }
  .option:hover:not(:disabled) { border-color: var(--sage); }
  .option:disabled { cursor: default; }
  .option.correct { border-color: var(--good); background: var(--good-bg); }
  .option.wrong { border-color: var(--bad); background: var(--bad-bg); }

  .feedback { min-height: 1.5em; margin: 16px 0 0; font-weight: 500; }
  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--bad); }

  .btn {
    width: 100%; margin-top: 16px; border: 0; border-radius: 16px; padding: 15px;
    background: var(--sage-deep); color: var(--cream);
    font: 800 1.02rem var(--font-display); letter-spacing: .04em; cursor: pointer;
  }
  .btn:hover { background: var(--sage); }
  :root[data-theme="dark"] .btn { color: #10201a; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn { color: #10201a; } }

  .result { text-align: center; }
  .result .big { font-family: var(--font-display); font-weight: 800; font-size: clamp(3rem, 16vw, 4.6rem); color: var(--sage-deep); line-height: 1; margin: 10px 0; }
  .result p { margin: 0 0 6px; color: var(--ink-soft); }
  .result .msg { font-weight: 500; color: var(--ink); font-size: 1.1rem; }
  [hidden] { display: none !important; }

  button:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
  footer { margin-top: 20px; text-align: center; font-size: .78rem; color: var(--ink-soft); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <h1>The General Knowledge Quiz</h1>
  <p class="sub">Answer 3 questions. Every correct answer earns +1 point.</p>

  <section id="game">
    <div class="status">
      <span id="count">Question 1 of 3</span>
      <span class="score">Score: <span id="score">0</span></span>
    </div>
    <div class="progress"><span id="bar"></span></div>
    <h2 class="question" id="question"></h2>
    <div class="options" id="options"></div>
    <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
    <button class="btn" id="next" type="button" hidden>Next question</button>
  </section>

  <section id="result" class="result" hidden>
    <p>Your final score</p>
    <div class="big" id="final"></div>
    <p class="msg" id="message"></p>
    <button class="btn" id="restart" type="button">Play again</button>
  </section>

  <footer>Decodelabs Project 4 &middot; Built with plain HTML, CSS and JavaScript</footer>
</main>

<script>
(function () {
  var questions = [
    { q: "What is the capital of France?", options: ["Berlin", "Paris", "Madrid", "Rome"], answer: 1 },
    { q: "Which planet is known as the Red Planet?", options: ["Venus", "Jupiter", "Mars", "Mercury"], answer: 2 },
    { q: "How many continents are there on Earth?", options: ["5", "6", "7", "8"], answer: 2 }
  ];

  var index = 0;
  var score = 0;

  var $ = function (id) { return document.getElementById(id); };
  var els = {
    game: $("game"), result: $("result"), count: $("count"), score: $("score"),
    bar: $("bar"), question: $("question"), options: $("options"),
    feedback: $("feedback"), next: $("next"), final: $("final"),
    message: $("message"), restart: $("restart")
  };

  function showQuestion() {
    var item = questions[index];
    els.count.textContent = "Question " + (index + 1) + " of " + questions.length;
    els.score.textContent = score;
    els.bar.style.width = (index / questions.length * 100) + "%";
    els.question.textContent = item.q;
    els.feedback.textContent = "";
    els.feedback.className = "feedback";
    els.next.hidden = true;
    els.options.innerHTML = "";

    item.options.forEach(function (text, i) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "option";
      btn.textContent = text;
      btn.addEventListener("click", function () { choose(i); });
      els.options.appendChild(btn);
    });
  }

  function choose(i) {
    var item = questions[index];
    var buttons = els.options.querySelectorAll(".option");
    buttons.forEach(function (b) { b.disabled = true; });

    // If-else logic: correct answer gets +1 point
    if (i === item.answer) {
      score = score + 1;
      buttons[i].classList.add("correct");
      els.feedback.textContent = "Correct! +1 point";
      els.feedback.classList.add("good");
    } else {
      buttons[i].classList.add("wrong");
      buttons[item.answer].classList.add("correct");
      els.feedback.textContent = "Wrong! The correct answer is " + item.options[item.answer] + ".";
      els.feedback.classList.add("bad");
    }

    els.score.textContent = score;
    els.next.textContent = index === questions.length - 1 ? "See final score" : "Next question";
    els.next.hidden = false;
    els.next.focus();
  }

  function showResult() {
    els.game.hidden = true;
    els.result.hidden = false;
    els.final.textContent = score + " / " + questions.length;
    var msg;
    if (score === 3) { msg = "Perfect score! Well done!"; }
    else if (score === 2) { msg = "Great job! Almost perfect."; }
    else if (score === 1) { msg = "Good try! Keep practising."; }
    else { msg = "Better luck next time!"; }
    els.message.textContent = msg;
    els.restart.focus();
  }

  els.next.addEventListener("click", function () {
    index = index + 1;
    if (index < questions.length) { showQuestion(); } else { showResult(); }
  });

  els.restart.addEventListener("click", function () {
    index = 0; score = 0;
    els.result.hidden = true;
    els.game.hidden = false;
    showQuestion();
  });

  showQuestion();
})();
</script>
</body>
</html>
